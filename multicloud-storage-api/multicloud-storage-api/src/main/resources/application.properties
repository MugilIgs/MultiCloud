spring.application.name=multicloud-storage-api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/multicloud_storage
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


storage.provider=GCP
replication.provider=AWS_S3

aws.s3.bucket-name=multicloud-storage-api-mugiligs
gcp.storage.bucket-name=cloud-of-clouds-mugil-2026-gcs

azure.storage.account-name= cloudoffcloudsmugil2026
azure.storage.container-name = files

jwt.secret=${JWT_SECRET}